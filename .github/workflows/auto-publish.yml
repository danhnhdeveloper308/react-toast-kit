name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsup.config.ts'
      - '.github/workflows/auto-publish.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_GH_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm format:check

      - name: Resolve next version from npm
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
        run: |
          current=$(npm view react-toast-kit version)
          next=$(node scripts/next-version.mjs "$current" "$RELEASE_TYPE")
          pnpm install --lockfile-only
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Build publish artifact
        run: pnpm build

      - name: Enforce bundle and performance budgets
        run: pnpm benchmark

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Commit release metadata
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v${NEXT_VERSION} [skip ci]"
          git tag -a "v${NEXT_VERSION}" -m "react-toast-kit v${NEXT_VERSION}"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ env.RELEASE_GH_TOKEN || github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: gh release create "v${NEXT_VERSION}" --generate-notes --title "react-toast-kit v${NEXT_VERSION}"

      - name: Refresh documentation deployment
        if: env.RELEASE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
        run: gh workflow run deploy.yml --repo danhnhdeveloper308/react-toast-kit-docs --ref main
