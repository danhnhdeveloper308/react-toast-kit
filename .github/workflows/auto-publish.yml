name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GH_TOKEN must be a Personal Access Token (classic) with `repo` scope.
          # GITHUB_TOKEN cannot push tags/commits back in most GitHub configurations.
          # Create one at: https://github.com/settings/tokens?type=legacy
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # registry-url causes setup-node to write a project-level .npmrc:
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # Without this line, NODE_AUTH_TOKEN is never wired into npm and
          # every npm command fails with ENEEDAUTH.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NODE_AUTH_TOKEN is read by the .npmrc written above — must match NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
