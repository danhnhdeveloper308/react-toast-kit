name: Release

# Triggered only when the CI workflow completes successfully on main.
# This eliminates the duplicate-run problem: CI and Release no longer both
# fire independently on every push — Release waits for CI to pass first.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger for hotfix / emergency releases without a full commit cycle.
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    # For workflow_run events, only proceed when CI passed.
    # workflow_dispatch has no .workflow_run context, so the condition
    # falls back to true and lets the manual trigger through unconditionally.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pin to the exact SHA that triggered CI to avoid race conditions on
          # rapid back-to-back pushes. Falls back to github.sha for manual runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # GH_TOKEN must be a Personal Access Token (classic) with `repo` scope.
          # GITHUB_TOKEN cannot push tags/commits back in most GitHub configurations.
          # Create one at: https://github.com/settings/tokens?type=legacy
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # registry-url causes setup-node to write a project-level .npmrc:
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # Without this line, NODE_AUTH_TOKEN is never wired into npm.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
