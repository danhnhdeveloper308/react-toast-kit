name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsup.config.ts'
      - '.releaserc.json'
      - '.prettierignore'
      - '.github/workflows/auto-publish.yml'
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_GH_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm format:check

      - name: Reconcile existing npm release tag
        run: |
          current=$(npm view react-toast-kit version)
          tag="v${current}"
          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git_head=$(npm view "react-toast-kit@${current}" gitHead)
            git merge-base --is-ancestor "$git_head" HEAD
            git tag -a "$tag" "$git_head" -m "react-toast-kit ${tag}"
            git push origin "$tag"
          fi

      - name: Build publish artifact
        run: pnpm build

      - name: Enforce bundle and performance budgets
        run: pnpm benchmark

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Analyze commits and publish release
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GH_TOKEN || github.token }}
        run: pnpm release

      - name: Refresh documentation deployment
        if: env.RELEASE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
        run: gh workflow run deploy.yml --repo danhnhdeveloper308/react-toast-kit-docs --ref main
