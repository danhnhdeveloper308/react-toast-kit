name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'docs/**'

jobs:
  ci:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || echo "⚠️  Lint warnings (non-blocking)"

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify build outputs
        run: |
          for f in dist/index.mjs dist/index.cjs dist/index.d.ts; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ Missing $f"; exit 1; }
          done

      - name: Test
        run: pnpm test --run || echo "⚠️  No tests found or tests failed (non-blocking)"

      - name: Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Node: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Package: $(node -p "require('./package.json').name + '@' + require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
